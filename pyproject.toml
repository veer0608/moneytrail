[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneytrail"
version = "0.1.0"
description = "Turn bank statements into a ledger that provably adds up."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
xlsx = ["openpyxl>=3.1"]
formats = ["pdfplumber>=0.11", "openpyxl>=3.1"]
# Asking a model needs nothing installed: moneytrail/llm.py speaks HTTP over
# the standard library, so `ask --model` works on a bare install. Only the
# golden set needs a dependency, and only to read its own YAML.
evals = ["pyyaml>=6"]
# The hosted front-end. Deliberately its own tier: the core still parses and
# reconciles with nothing installed, and nobody running the CLI pays for a web
# framework they will never import.
web = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8", "pdfplumber>=0.11", "openpyxl>=3.1", "reportlab>=4", "pyyaml>=6",
    "fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9", "httpx>=0.27",
]

[project.scripts]
moneytrail = "moneytrail.cli:main"

[tool.setuptools.packages.find]
include = ["moneytrail*"]

[tool.setuptools.package-data]
moneytrail = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
