name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # The unit tests could all pass while the thing the project exists to do
      # quietly stopped working, so the gate is exercised end to end as well.
      #
      # The list is checked against the fixtures directory by a test, because a
      # hand-maintained one drifts: five fixtures -- including both PDFs that
      # exercise the word-position parser -- sat here unlisted while their unit
      # tests passed, so that whole path could have broken with CI still green.
      - name: Every clean fixture must reconcile
        run: |
          set -e
          CLEAN="
            hdfc_april_2025.csv
            hdfc_april_2025.pdf
            hdfc_april_2025.xls
            hdfc_april_2025_unruled.pdf
            hdfc_card_july_2025.csv
            hdfc_jan_may_2025.csv
            hdfc_july_2025.csv
            hdfc_aug_2025.csv
            icici_aug_2025.csv
            icici_may_2025_signed.csv
            icici_currency_headers.csv
            icici_july_2026_wrapped.pdf
            axis_stated_totals.csv
          "
          for clean in $CLEAN; do
            echo "--- $clean"
            python -m moneytrail check --no-prompt "tests/fixtures/$clean"
          done

      # A checker that never fails is not a checker. Each deliberately broken
      # fixture has to keep being caught, and they break differently: one loses
      # a row from the middle, where the chain check sees it, and one loses the
      # last row, where only the bank's own stated total does.
      - name: And the broken ones must still be caught
        run: |
          BROKEN="
            hdfc_april_2025_dropped_row.csv
            axis_stated_totals_dropped.csv
          "
          for broken in $BROKEN; do
            if python -m moneytrail check --no-prompt "tests/fixtures/$broken"; then
              echo "::error::$broken reconciled - the gate is broken"
              exit 1
            fi
          done

      # The golden set is scored against the built-in parser only. Model
      # accuracy costs money and moves on someone else's schedule, so it is
      # measured deliberately and never gates a merge.
      - name: The built-in parser must stay perfect on what it covers
        run: python -m evals.runner --gate

      - name: The report must stay self-contained
        run: |
          python -m moneytrail report tests/fixtures/hdfc_jan_may_2025.csv --out /tmp/r.html
          if grep -qE 'https?://|<script|src=|@import' /tmp/r.html; then
            echo "::error::the generated report reaches off the machine"
            exit 1
          fi
