name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # The unit tests could all pass while the thing the project exists to do
      # quietly stopped working, so the gate is exercised end to end as well.
      - name: Every clean fixture must reconcile
        run: |
          python -m moneytrail check --no-prompt \
            tests/fixtures/hdfc_april_2025.csv \
            tests/fixtures/hdfc_april_2025.pdf \
            tests/fixtures/hdfc_april_2025.xls \
            tests/fixtures/hdfc_card_july_2025.csv \
            tests/fixtures/hdfc_jan_may_2025.csv \
            tests/fixtures/hdfc_july_2025.csv \
            tests/fixtures/hdfc_aug_2025.csv \
            tests/fixtures/icici_aug_2025.csv

      # A checker that never fails is not a checker. The deliberately broken
      # fixture has to keep being caught.
      - name: And the broken one must still be caught
        run: |
          if python -m moneytrail check --no-prompt \
               tests/fixtures/hdfc_april_2025_dropped_row.csv; then
            echo "::error::a statement with a dropped row reconciled - the gate is broken"
            exit 1
          fi

      # The golden set is scored against the built-in parser only. Model
      # accuracy costs money and moves on someone else's schedule, so it is
      # measured deliberately and never gates a merge.
      - name: The built-in parser must stay perfect on what it covers
        run: python -m evals.runner --gate

      - name: The report must stay self-contained
        run: |
          python -m moneytrail report tests/fixtures/hdfc_jan_may_2025.csv --out /tmp/r.html
          if grep -qE 'https?://|<script|src=|@import' /tmp/r.html; then
            echo "::error::the generated report reaches off the machine"
            exit 1
          fi
